openapi: 3.0.3
info:
  title: Parking POC API
  version: 0.1.0
  x-contract-status: frozen  # M0-frozen — changes only via reviewed PR
  description: >
    Office parking-slot booking platform. Contract-first source of truth (frozen at M0 — changes via
    reviewed PR). Conventions, envelope, and error codes per docs/phases-3-6-plan.md §3.1–3.2.
    Maturity of each operation is marked with `x-maturity` (DEMO | MVP | Later).

servers:
  - url: /api/v1
    description: Base path (path-based versioning)

# Default: every operation requires a bearer access token. Public endpoints override with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication & session lifecycle
  - name: User
    description: Current-user (self) profile, bookings, notifications
  - name: Bookings
    description: Parking booking requests — create, status, edit, cancel, release (P3-06)
  - name: Allocation
    description: Primary/common-pool allocation runs and score breakdowns (P3-07)
  - name: Companies
    description: Company management (Super Admin) + public active list
  - name: Company Users
    description: Company user management — approval, status, admin assignment
  - name: Slots & Quota
    description: Physical parking slots + effective-dated company quota
  - name: Blocking
    description: Company quota blocking (Super Admin any company, Company Admin own)
  - name: Config
    description: System configuration — booking/allocation timings and weights (D8)
  - name: Dashboards
    description: Pre-aggregated counts per role
  - name: Reports
    description: Reporting + CSV export (Later)

paths:
  # ---------------------------------------------------------------------------
  # Auth  (P3-02)
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in (issue access + refresh)
      description: >
        Validates credentials and returns a short-lived access JWT. A refresh token is set as an
        HttpOnly, Secure, SameSite cookie (rotation is [MVP]). Errors: 401 on bad credentials,
        403 if the user's status is not ACTIVE.
      x-maturity: DEMO
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: aditi@assent.example, password: "ChangeMe#12345" }
      responses:
        '200':
          description: Authenticated. Refresh token set via Set-Cookie.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Set-Cookie:
              description: HttpOnly refresh-token cookie (e.g. `refreshToken=…; HttpOnly; Secure; SameSite=Strict`)
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponseData' }
              example:
                success: true
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tokenType: Bearer
                  expiresIn: 900
                  user: { id: "usr_123", fullName: "Aditi Rao", role: USER, companyId: "cmp_1", companyName: Assent }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a new company user (status PENDING)
      description: >
        Creates a user under an active company with status PENDING (awaits Company-Admin approval).
        Validations — unique email, valid contact number, valid PIN, distanceKm 0–200, password strength,
        company must be active, one company per user.
      x-maturity: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registration accepted; verification email dispatched.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm an email-verification token
      x-maturity: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Rotate refresh token, issue a new access token
      description: Uses the HttpOnly refresh cookie; rotates it and returns a fresh access token.
      x-maturity: MVP
      security: []
      responses:
        '200':
          description: New access token issued; refresh cookie rotated.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Set-Cookie:
              description: Rotated HttpOnly refresh-token cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AccessTokenData' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh token
      x-maturity: MVP
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password-reset email
      x-maturity: Later
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset password using a reset token
      x-maturity: Later
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change password (authenticated)
      x-maturity: Later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------------------
  # User (self)  (P3-03)
  # ---------------------------------------------------------------------------
  /me:
    get:
      tags: [User]
      operationId: getMe
      summary: Get the current user's profile
      x-maturity: DEMO
      responses:
        '200':
          description: Current profile
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [User]
      operationId: updateMe
      summary: Update the current user's profile (incl. distanceKm)
      description: Partial update. `distanceKm` is the manually-entered home→office distance (0–200 km).
      x-maturity: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated profile
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/bookings:
    get:
      tags: [User]
      operationId: getMyBookings
      summary: List the current user's bookings (paged)
      x-maturity: DEMO
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: status
          in: query
          required: false
          description: Optional filter by booking status
          schema: { $ref: '#/components/schemas/BookingStatus' }
      responses:
        '200':
          description: Paged list of the user's bookings
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Booking' }
                      meta: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notifications:
    get:
      tags: [User]
      operationId: getMyNotifications
      summary: List the current user's in-app notifications (paged)
      x-maturity: MVP
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paged list of notifications
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
                      meta: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    patch:
      tags: [User]
      operationId: markNotificationRead
      summary: Mark a notification as read
      x-maturity: MVP
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Notification marked read
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Bookings  (P3-06)  — Role: USER (own). Tenant-scoped by companyId.
  # ---------------------------------------------------------------------------
  /bookings:
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: List bookings for admins (paged, newest first)
      description: >
        Role COMPANY_ADMIN (scoped to their own company) or SUPER_ADMIN (all companies; optional
        `companyId` filter). Each row carries who booked, the date, status, and allocated slot.
        Filter by `date` and/or `status`.
      x-maturity: DEMO
      x-required-roles: [COMPANY_ADMIN, SUPER_ADMIN]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: date
          in: query
          required: false
          description: Filter to a single booking date (YYYY-MM-DD).
          schema: { type: string, format: date }
        - name: companyId
          in: query
          required: false
          description: SUPER_ADMIN only — narrow to one company. Ignored for COMPANY_ADMIN.
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: Optional filter by booking status.
          schema: { $ref: '#/components/schemas/BookingStatus' }
      responses:
        '200':
          description: Paged list of bookings.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminBooking' }
                      meta: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Submit a parking request for the next bookable weekday
      description: >
        Role: USER. Creates a PRIMARY booking for a bookable weekday (Mon–Fri, D7). `travelDistanceKm` is
        snapshotted from the user's profile at submission (F6); `carpoolPeople` includes the driver as person 1
        (D3) and the server enforces the current `carpool.maxPeople` cap (default 4, D8). Only same-company
        employee carpool members are scored (F4). Errors: 422 WINDOW_CLOSED if past `booking.primaryCutoff` or
        a non-bookable date; 409 CONFLICT on a duplicate same-type request for the date.
      x-maturity: DEMO
      x-required-roles: [USER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
            example:
              bookingDate: "2026-07-31"
              vehicleType: CAR
              vehicleNumber: MH12AB1234
              carpoolPeople: 3
              specialRequirement: null
              carpoolMembers:
                - { name: Rahul Mehta, employeeEmail: rahul@assent.example }
                - { name: Neighbour, employeeEmail: null }
      responses:
        '201':
          description: Booking submitted.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingCreatedData' }
              example:
                success: true
                data:
                  id: bkg_123
                  status: SUBMITTED
                  bookingType: PRIMARY
                  bookingDate: "2026-07-31"
                  travelDistanceKm: 12.4
                  carpoolPeople: 3
                  submittedAt: "2026-07-30T11:20:00Z"
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/WindowClosed' }

  /bookings/common-pool:
    post:
      tags: [Bookings]
      operationId: createCommonPoolBooking
      summary: Submit a common-pool request (after primary results)
      description: >
        Role: USER. Same body as POST /bookings but recorded as a COMMON_POOL request. Valid only while the
        common-pool window is open (`booking.primaryResultsBy` → `booking.commonPoolClose`, D8).
      x-maturity: Later
      x-required-roles: [USER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201':
          description: Common-pool request submitted.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingCreatedData' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/WindowClosed' }

  /bookings/{id}:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Get a booking's status, allocated slot, and score breakdown
      description: "Role: USER (own) / COMPANY_ADMIN (own company) / SUPER_ADMIN. Returns 404 if not visible to the tenant."
      x-maturity: DEMO
      x-required-roles: [USER, COMPANY_ADMIN, SUPER_ADMIN]
      responses:
        '200':
          description: Booking detail incl. allocated slot and per-factor score breakdown (once allocation has run).
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Bookings]
      operationId: updateBooking
      summary: Edit a booking before the primary cutoff
      description: "Role: USER (own). Partial edit; allowed only while `now < booking.primaryCutoff` (else 422 WINDOW_CLOSED)."
      x-maturity: MVP
      x-required-roles: [USER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBookingRequest' }
      responses:
        '200':
          description: Booking updated.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/WindowClosed' }

  /bookings/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    post:
      tags: [Bookings]
      operationId: cancelBooking
      summary: Cancel a booking before the primary cutoff
      description: "Role: USER (own). Allowed only while `now < booking.primaryCutoff` (else 422 WINDOW_CLOSED)."
      x-maturity: MVP
      x-required-roles: [USER]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelBookingRequest' }
      responses:
        '200':
          description: Booking cancelled.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/WindowClosed' }

  /bookings/{id}/release:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    post:
      tags: [Bookings]
      operationId: releaseBooking
      summary: Release an allocated slot
      description: >
        Role: USER (own) or COMPANY_ADMIN (own users). Releasing an allocated slot after primary allocation
        triggers reallocation to the highest-scoring own-company waitlisted user first, else the slot moves to
        the common pool (F3). Audited + notified.
      x-maturity: MVP
      x-required-roles: [USER, COMPANY_ADMIN]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseBookingRequest' }
      responses:
        '200':
          description: Slot released (reallocation handled server-side, F3).
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------------------
  # Allocation  (P3-07)  — Role: SUPER_ADMIN.
  # ---------------------------------------------------------------------------
  /allocation/primary/run:
    post:
      tags: [Allocation]
      operationId: runPrimaryAllocation
      summary: Run (or re-run) primary allocation for a date
      description: >
        Role: SUPER_ADMIN. Idempotent per (runType=PRIMARY, bookingDate) — a COMPLETED run returns the cached
        result. Ranks SUBMITTED PRIMARY bookings by FinalScore (decisions §3) within each company's available
        quota, assigns concrete slots transactionally, and waitlists the rest.
      x-maturity: DEMO
      x-required-roles: [SUPER_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrimaryRunRequest' }
            example: { bookingDate: "2026-07-31" }
      responses:
        '200':
          description: Allocation run accepted or already complete (idempotent). Returns the run summary.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AllocationRunSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /allocation/common-pool/run:
    post:
      tags: [Allocation]
      operationId: runCommonPoolAllocation
      summary: Run common-pool allocation for a date
      description: >
        Role: SUPER_ADMIN. Idempotent per (runType=COMMON_POOL, bookingDate). Enrolls the users
        waitlisted by primary as common-pool requests, derives pool inventory from every company's
        unused quota, and assigns it cross-company by FinalScore.
      x-maturity: DEMO
      x-required-roles: [SUPER_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrimaryRunRequest' }
      responses:
        '200':
          description: Common-pool allocation run summary.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AllocationRunSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /allocation/override:
    post:
      tags: [Allocation]
      operationId: overrideAllocation
      summary: Manually override a single allocation
      description: "Role: SUPER_ADMIN. Assigns a specific slot to a booking, bypassing the scored ranking. Audited."
      x-maturity: MVP
      x-required-roles: [SUPER_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationOverrideRequest' }
      responses:
        '200':
          description: Override applied; returns the affected booking.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingDetail' }
