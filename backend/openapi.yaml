        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /gate/check-out:
    post:
      tags: [Gate]
      operationId: gateCheckOut
      summary: Record a vehicle leaving
      description: >
        Role SECURITY. Closes the car's open visit (the most recent one, so a car that entered before
        IST midnight and leaves after it still checks out cleanly). 404 when it is not inside.
      x-maturity: MVP
      x-required-roles: [SECURITY]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GateCheckOutRequest' }
      responses:
        '200':
          description: Visit closed.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GateEvent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /gate/events:
    get:
      tags: [Gate]
      operationId: listGateEvents
      summary: Gate log for a date (paged, newest first)
      description: 'Roles SECURITY, SUPER_ADMIN. Defaults to today (IST). Building-wide (D15).'
      x-maturity: MVP
      x-required-roles: [SECURITY, SUPER_ADMIN]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [CHECKED_IN, CHECKED_OUT] }
      responses:
        '200':
          description: Paged gate log.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/GateEvent' }
                      meta: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /gate/unbooked:
    get:
      tags: [Gate]
      operationId: listUnbookedEntries
      summary: Entries recorded without a booking (company-admin follow-up feed)
      description: >
        Roles COMPANY_ADMIN (own company) or SUPER_ADMIN (all; optional `companyId`). These are the
        D16 entries the guard let through without a booking. An unregistered plate has no company, so
        it appears only for the SUPER_ADMIN — nobody can attribute an unknown car to a tenant.
      x-maturity: MVP
      x-required-roles: [COMPANY_ADMIN, SUPER_ADMIN]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - name: companyId
          in: query
          required: false
          description: SUPER_ADMIN only — narrow to one company. Ignored for COMPANY_ADMIN.
          schema: { type: string }
      responses:
        '200':
          description: Paged unbooked entries.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/GateEvent' }
                      meta: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------------------
  # Reports  (P3-09 — Later)
  # ---------------------------------------------------------------------------
  /reports/{type}:
    parameters:
      - name: type
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ReportType' }
    get:
      tags: [Reports]
      operationId: getReport
      summary: Get a report (Later)
      x-maturity: Later
      x-required-roles: [SUPER_ADMIN, COMPANY_ADMIN]
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: dateFrom, in: query, required: false, schema: { type: string, format: date } }
        - { name: dateTo, in: query, required: false, schema: { type: string, format: date } }
        - { name: companyId, in: query, required: false, schema: { type: string } }
        - { name: userId, in: query, required: false, schema: { type: string } }
        - { name: slotId, in: query, required: false, schema: { type: string } }
        - name: bookingType
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BookingType' }
        - name: bookingStatus
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Report rows (shape depends on report type)
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [meta]
                    properties:
                      data:
                        type: array
                        items: { type: object, additionalProperties: true }
                      meta: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/{type}/export:
    parameters:
      - name: type
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ReportType' }
    get:
      tags: [Reports]
      operationId: exportReport
      summary: Export a report as CSV (Later; async for large sets)
      x-maturity: Later
      x-required-roles: [SUPER_ADMIN, COMPANY_ADMIN]
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

# =============================================================================
# Reusable components  (P3-01)
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token from `POST /auth/login`, sent as `Authorization: Bearer <token>`."

  headers:
    CorrelationId:
      description: Request/response correlation id (echoed into AuditLog).
      schema: { type: string }

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: Items per page (max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SortParam:
      name: sort
      in: query
      required: false
      description: Field to sort by.
      schema: { type: string }
    OrderParam:
      name: order
      in: query
      required: false
      description: Sort direction.
      schema: { type: string, enum: [asc, desc], default: desc }
    BookingIdParam:
      name: id
      in: path
      required: true
      description: Booking request id.
      schema: { type: string }
    RunIdParam:
      name: id
      in: path
      required: true
      description: Allocation run id.
      schema: { type: string }

  schemas:
    # --- Envelope & pagination (reusable) ---
    SuccessEnvelope:
      type: object
      description: Standard success envelope. `data` is the resource/list; `meta` present only on list endpoints.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        # No `type` here: each endpoint overrides `data` (object or array) via allOf.
        data:
          description: Resource or list payload; concrete shape defined per endpoint.
        meta: { $ref: '#/components/schemas/Pagination' }

    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error: { $ref: '#/components/schemas/ErrorObject' }

    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    ErrorCode:
      type: string
      description: Canonical error codes (docs/phases-3-6-plan.md §3.2).
      enum:
        - VALIDATION_ERROR   # 400
        - UNAUTHENTICATED    # 401
        - FORBIDDEN          # 403
        - NOT_FOUND          # 404
        - CONFLICT           # 409
        - WINDOW_CLOSED      # 422
        - RATE_LIMITED       # 429
        - INTERNAL           # 500

    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    # --- Enums (from prisma/schema.prisma) ---
    RoleName:
      type: string
      enum: [SUPER_ADMIN, COMPANY_ADMIN, SECURITY, USER]
    UserStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED, INACTIVE]
    BookingType:
      type: string
      enum: [PRIMARY, COMMON_POOL]
    BookingStatus:
      type: string
      enum: [DRAFT, SUBMITTED, CANCELLED, ALLOCATED, WAITLISTED, REJECTED, RELEASED, EXPIRED]
    VehicleType:
      type: string
      enum: [CAR, BIKE, EV_CAR, EV_BIKE, OTHER]
    NotificationChannel:
      type: string
      enum: [EMAIL, IN_APP, SMS, PUSH]
    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED, READ]

    # --- Auth ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 1 }

    AuthUser:
      type: object
      required: [id, fullName, role, companyId, companyName]
      properties:
        id: { type: string }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/RoleName' }
        companyId: { type: string }
        companyName: { type: string }

    AccessTokenData:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Access-token lifetime in seconds. }

    LoginResponseData:
      allOf:
        - $ref: '#/components/schemas/AccessTokenData'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/AuthUser' }

    RegisterRequest:
      type: object
      description: >
        `companyId`, `address` and `pinCode` are required for EMPLOYEE and COMPANY_ADMIN but are NOT
        collected from a SECURITY applicant (Phase 7 D15) — a gate operator has no tenant to pick and
        no commute to record, so the server assigns the building company and stores no home address.
        Sending them as a SECURITY applicant is not an error; they are ignored.
      required: [fullName, email, contactNumber, password, confirmPassword]
      properties:
        fullName: { type: string }
        companyId:
          type: string
          description: Must reference an ACTIVE company. Required unless `registrationType` is SECURITY.
        email: { type: string, format: email }
        contactNumber: { type: string }
        address: { type: string, description: Required unless `registrationType` is SECURITY. }
        pinCode: { type: string, description: Required unless `registrationType` is SECURITY. }
        registrationType:
          type: string
          enum: [EMPLOYEE, COMPANY_ADMIN, SECURITY]
          default: EMPLOYEE
          description: >
            Who the applicant registers as. EMPLOYEE → USER role, approved by the Company Admin.
            COMPANY_ADMIN → requests admin of the (existing, ACTIVE) company, approved by the
            Super Admin; approval also grants the CompanyAdmin assignment (F11).
            SECURITY → a building gate operator (Phase 7 D15), approved by the Super Admin only;
            approval simply activates the account. Registers against the building company.
        distanceKm:
          type: number
          nullable: true
          minimum: 0
          maximum: 200
          description: >
            Manually-entered home→office distance in km (D6). Optional at registration, and ignored for
            a SECURITY applicant (a guard is never allocated a slot, so is never scored).
        password: { type: string, format: password }
        confirmPassword: { type: string, format: password }

    # --- User (self) ---
    UserProfile:
      type: object
      required: [id, fullName, email, contactNumber, address, pinCode, status, emailVerified, companyId, companyName, role]
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        contactNumber: { type: string }
        address: { type: string }
        pinCode: { type: string }
        distanceKm: { type: number, nullable: true, minimum: 0, maximum: 200 }
        status: { $ref: '#/components/schemas/UserStatus' }
        emailVerified: { type: boolean }
        companyId: { type: string }
        companyName: { type: string }
        role: { $ref: '#/components/schemas/RoleName' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpdateProfileRequest:
      type: object
      description: Partial update; all fields optional.
      properties:
        fullName: { type: string }
        contactNumber: { type: string }
        address: { type: string }
        pinCode: { type: string }
        distanceKm: { type: number, nullable: true, minimum: 0, maximum: 200 }

    CreateMyVehicleRequest:
      type: object
      required: [vehicleNumber]
      properties:
        vehicleNumber:
          type: string
          description: Any spacing/case; normalized server-side for security lookup.
        displayNumber:
          type: string
          description: Optional display form shown to security.
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        makeModel: { type: string, nullable: true }
        colour: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    Booking:
      type: object
      required: [id, bookingDate, bookingType, status, carpoolMemberCount, createdAt]
      properties:
        id: { type: string }
        bookingDate: { type: string, format: date }
        bookingType: { $ref: '#/components/schemas/BookingType' }
        status: { $ref: '#/components/schemas/BookingStatus' }
        travelDistanceKm: { type: number, nullable: true }
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        vehicleNumber: { type: string, nullable: true }
        carpoolMemberCount: { type: integer, minimum: 0 }
        specialRequirement: { type: string, nullable: true }
        allocationScore: { type: number, nullable: true }
        allocatedSlotNumber:
          type: string
          nullable: true
          description: Slot number if ALLOCATED, else null.
        submittedAt: { type: string, nullable: true, format: date-time }
        createdAt: { type: string, format: date-time }

    AdminBooking:
      type: object
      description: A booking row for the admin dashboards — who booked, when, its status and slot.
      required: [id, bookingDate, bookingType, allocationSource, status, employeeName, employeeEmail, companyId, companyName, carpoolPeople, createdAt]
      properties:
        id: { type: string }
        bookingDate: { type: string, format: date }
        bookingType: { $ref: '#/components/schemas/BookingType' }
        allocationSource:
          type: string
          nullable: true
          enum: [PRIMARY, COMMON_POOL, RELEASED_SLOT, MANUAL_OVERRIDE]
          description: Actual source of the allocated seat; null when no seat is assigned.
        status: { $ref: '#/components/schemas/BookingStatus' }
        employeeName: { type: string }
        employeeEmail: { type: string, format: email }
        companyId: { type: string }
        companyName: { type: string }
        travelDistanceKm: { type: number, nullable: true }
        carpoolPeople: { type: integer, minimum: 1, description: Driver + declared members. }
        carpoolMembers:
          type: array
          description: Declared passengers carried by the driver.
          items:
            type: object
            required: [id, name, sameCompany, isScored]
            properties:
              id: { type: string }
              name: { type: string }
              employeeEmail: { type: string, format: email, nullable: true }
              contactNumber: { type: string, nullable: true }
              pickupLocation: { type: string, nullable: true }
              sameCompany: { type: boolean }
              isScored: { type: boolean }
        allocationScore: { type: number, nullable: true }
        allocatedSlotNumber: { type: string, nullable: true, description: Slot number if ALLOCATED, else null. }
        submittedAt: { type: string, nullable: true, format: date-time }
        createdAt: { type: string, format: date-time }
        history:
          type: array
          description: Same employee/date booking lifecycle rows, grouped before pagination.
          items: { $ref: '#/components/schemas/AdminBooking' }

    AllocationRosterItem:
      type: object
      description: One allocated seat and who holds it for the date (primary or common pool).
      required: [id, slotNumber, allocationType, bookingDate, employeeName, employeeEmail, companyId, companyName]
      properties:
        id: { type: string }
        slotNumber: { type: string }
        allocationType: { $ref: '#/components/schemas/BookingType' }
        bookingDate: { type: string, format: date }
        employeeName: { type: string }
        employeeEmail: { type: string, format: email }
        companyId: { type: string }
        companyName: { type: string }
        allocationScore: { type: number, nullable: true }

    Notification:
      type: object
      required: [id, channel, status, subject, body, createdAt]
      properties:
        id: { type: string }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        status: { $ref: '#/components/schemas/NotificationStatus' }
        subject: { type: string }
        body: { type: string }
        metadata: { type: object, nullable: true, additionalProperties: true }
        sentAt: { type: string, nullable: true, format: date-time }
        readAt: { type: string, nullable: true, format: date-time }
        createdAt: { type: string, format: date-time }

    # --- Enums (P3-04, P3-05) ---
    CompanyStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    SlotType:
      type: string
      enum: [STANDARD, ACCESSIBLE, EV_CHARGING, VISITOR, RESERVED]
    SlotStatus:
      type: string
      enum: [AVAILABLE, ALLOCATED_TO_COMPANY, BLOCKED, BOOKED, COMMON_POOL, UNDER_MAINTENANCE, INACTIVE]
    BlockReason:
      type: string
      enum: [RESERVED_VISITOR, RESERVED_LEADERSHIP, MAINTENANCE, COMPANY_EVENT, EMERGENCY, OTHER]
    ApprovalDecision:
      type: string
      enum: [APPROVE, REJECT]

    # --- Companies (P3-04) ---
    Company:
      type: object
      required: [id, name, code, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        status: { $ref: '#/components/schemas/CompanyStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompanySummary:
      type: object
      description: Public subset for the registration dropdown.
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    CompanyQuotaSummaryEntry:
      type: object
      description: A company's effective assigned slot quota on a given date.
      required: [companyId, assignedSlots]
      properties:
        companyId: { type: string }
        assignedSlots: { type: integer }
    CreateCompanyRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string }
        code:
          type: string
          description: Short unique tenant code (e.g. ASSENT).
    UpdateCompanyRequest:
      type: object
      properties:
        name: { type: string }
    UpdateCompanyStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/CompanyStatus' }

    # --- Company Users (P3-04) ---
    ApprovalRequest:
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/ApprovalDecision' }
    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }
    AssignAdminRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string }

    # --- Slots & Quota (P3-05) ---
    ParkingArea:
      type: object
      required: [id, name, officeLocationId]
      properties:
        id: { type: string }
        name: { type: string }
        floor: { type: string, nullable: true }
        officeLocationId: { type: string }
    CreateParkingAreaRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        floor: { type: string, nullable: true }
    ParkingSlot:
      type: object
      required: [id, slotNumber, parkingAreaId, slotType, status, hasEvCharging, isAccessible, createdAt, updatedAt]
      properties:
        id: { type: string }
        slotNumber: { type: string }
        parkingAreaId: { type: string }
        slotType: { $ref: '#/components/schemas/SlotType' }
        status: { $ref: '#/components/schemas/SlotStatus' }
        hasEvCharging: { type: boolean }
        isAccessible: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateSlotRequest:
      type: object
      required: [slotNumber, parkingAreaId]
      properties:
        slotNumber: { type: string }
        parkingAreaId: { type: string }
        slotType: { $ref: '#/components/schemas/SlotType' }
        hasEvCharging: { type: boolean, default: false }
        isAccessible: { type: boolean, default: false }
    UpdateSlotRequest:
      type: object
      properties:
        slotNumber: { type: string }
        slotType: { $ref: '#/components/schemas/SlotType' }
        status: { $ref: '#/components/schemas/SlotStatus' }
        hasEvCharging: { type: boolean }
        isAccessible: { type: boolean }
    CompanyQuota:
      type: object
      description: Effective-dated company slot quota (CompanySlotAllocation).
      required: [id, companyId, slotCount, effectiveFrom, createdAt]
      properties:
        id: { type: string }
        companyId: { type: string }
        slotCount: { type: integer, minimum: 0 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, nullable: true, format: date }
        createdAt: { type: string, format: date-time }
    CreateQuotaRequest:
      type: object
      required: [slotCount, effectiveFrom]
      properties:
        slotCount: { type: integer, minimum: 0 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, nullable: true, format: date }

    # --- Blocking (P3-05) ---
    SlotBlock:
      type: object
      required: [id, companyId, blockedCount, startDate, endDate, reason, createdAt]
      properties:
        id: { type: string }
        companyId: { type: string }
        blockedCount: { type: integer, minimum: 1 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { $ref: '#/components/schemas/BlockReason' }
        reasonText: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateBlockRequest:
      type: object
      required: [blockedCount, startDate, endDate, reason]
      properties:
        blockedCount: { type: integer, minimum: 1 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { $ref: '#/components/schemas/BlockReason' }
        reasonText: { type: string, nullable: true }

    # --- Config & Dashboards (P3-08) ---
    ConfigValueType:
      type: string
      enum: [STRING, NUMBER, BOOLEAN, JSON, TIME]
    ConfigEntry:
      type: object
      required: [key, value, valueType]
      properties:
        key: { type: string }
        value: { type: string }
        valueType: { $ref: '#/components/schemas/ConfigValueType' }
        description: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    UpdateConfigRequest:
      type: object
      description: Partial map of config key → new value (all values as strings).
      minProperties: 1
      additionalProperties: { type: string }
    SuperAdminDashboard:
      type: object
      properties:
        totalParkingSlots: { type: integer }
        totalActiveCompanies: { type: integer }
        blockedSlots: { type: integer }
        availableSlots: { type: integer }
        primaryBookings: { type: integer }
        commonPoolBookings: { type: integer }
        waitlistCount: { type: integer }
        dailyUtilizationPct: { type: number }
    CompanyAdminDashboard:
      type: object
      properties:
        totalCompanySlots: { type: integer, description: Current effective quota. }
        availableCompanySlots: { type: integer }
        blockedSlots: { type: integer }
        bookedSlots: { type: integer }
        commonPoolSlots: { type: integer }
        totalBookingRequests: { type: integer }
        allocatedUsers: { type: integer }
        waitlistedUsers: { type: integer }
        dailyUtilizationPct: { type: number }
    UserDashboard:
      type: object
      properties:
        upcomingBooking:
          allOf: [ { $ref: '#/components/schemas/Booking' } ]
          description: Absent when the user has no upcoming booking.
        cutoffCountdownSeconds: { type: integer, nullable: true }
        nextAllocationRunAt: { type: string, format: date-time }
        nextAllocationRunCountdownSeconds: { type: integer }
        nextAllocationRuns:
          type: array
          items: { type: string, format: date-time }
        previousBookingsCount: { type: integer }

    # --- Booking window + availability grid (Phase 7) ---
    BookingWindow:
      type: object
      description: >
        The rolling request window and the weekly run it closes at (Phase 7 §3). Everything the client
        needs to say "book between X and Y; results published on Z".
      required:
        [nextRunAt, nextRunCountdownSeconds, requestCloseAt, requestCloseCountdownSeconds, resultsRunAt,
         runDay, runFrequency, runTime, commonPoolRunTime, nextCommonPoolRunAt, windowWeeks,
         approvalLeadDays, earliestDate, latestDate, requestableDates, nextRuns, scoring]
      properties:
        nextRunAt: { type: string, format: date-time, description: When the next automatic batch runs. }
        nextRunCountdownSeconds: { type: integer, description: Seconds until `nextRunAt`; 0 once passed. }
        requestCloseAt: { type: string, format: date-time, description: When requests close for the next processed band. }
        requestCloseCountdownSeconds: { type: integer, description: Seconds until `requestCloseAt`; 0 once passed. }
        resultsRunAt: { type: string, format: date-time, description: Run that publishes results for the open request band. }
        runDay: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        runFrequency: { type: string, enum: [WEEKLY, BIWEEKLY, MONTHLY] }
        runTime: { type: string, description: 'HH:MM IST.' }
        commonPoolRunTime:
          type: string
          description: >
            'HH:MM IST the common-pool half fires at, on the same run day. Never earlier than `runTime`;
            equal to it (the default) means both halves run back-to-back in one tick.'
        nextCommonPoolRunAt:
          type: string
          format: date-time
          description: >
            When the next automatic common-pool run fires. Between the primary instant and the pool
            instant on a run day this is *today*, not `nextRunAt` — the pool still owes this run's band.
        windowWeeks: { type: integer, enum: [2, 4] }
        approvalLeadDays: { type: integer, description: Days a date is decided ahead of itself (D11). }
        earliestDate: { type: string, format: date }
        latestDate: { type: string, format: date }
        requestableDates:
          type: array
          description: Bookable weekdays currently open for requests.
          items: { type: string, format: date }
        nextRuns:
          type: array
          description: Next five automatic allocation run instants.
          items: { type: string, format: date-time }
        scoring:
          $ref: '#/components/schemas/BookingWindowScoring'

    BookingWindowScoring:
      type: object
      description: >
        Live scoring inputs (§4, D3) so the booking form can compute a user's score client-side with no
        extra round-trip as they add carpool members. Super-Admin editable; not a promise of outcome —
        ranking and tie-breakers still decide.
      required: [distanceWeight, carpoolWeight, maxDistanceKm, maxPeople]
      properties:
        distanceWeight: { type: number, description: 'Weight applied to distanceScore (default 0.60).' }
        carpoolWeight: { type: number, description: 'Weight applied to carpoolScore (default 0.40).' }
        maxDistanceKm: { type: number, description: 'Distance at which distanceScore caps at 100 (default 40).' }
        maxPeople: { type: integer, description: 'Carpool size at which carpoolScore caps at 100 (default 4).' }

    SlotBoxState:
      type: string
      description: >
        MINE = the caller's own reservation, TAKEN = someone else's, BLOCKED = withheld by an admin,
        AVAILABLE = free. Render AVAILABLE green and everything else grey.
      enum: [AVAILABLE, TAKEN, BLOCKED, MINE]

    SlotBox:
      type: object
      required: [index, state, slotNumber]
      properties:
        index: { type: integer, description: 1-based position in the grid. }
        state: { $ref: '#/components/schemas/SlotBoxState' }
        slotNumber:
          type: string
          nullable: true
          description: >
            The real `ParkingSlot.slotNumber` (a free-form label, e.g. `B1-07` — not an ordinal),
            populated only when `phase = DECIDED` and the box is `MINE` or `TAKEN`. `null` while
            `OPEN`, or for `AVAILABLE`/`BLOCKED` boxes. Not to be confused with `index`, which orders
            the grid.

    UnavailableReason:
      type: string
      description: Why a date cannot be requested; `null` when it can.
      enum: [INVALID_DATE, NOT_WEEKDAY, TOO_SOON, BEYOND_WINDOW, NO_QUOTA, ALREADY_BOOKED]

    DayAvailabilityPhase:
      type: string
      description: >
        OPEN = before the date's weekly run; grid shows only AVAILABLE/BLOCKED and demand is a count.
        DECIDED = after the run; grid shows real allocations (D22).
      enum: [OPEN, DECIDED]

    DayAvailabilityMyStatus:
      type: string
      nullable: true
      description: >
        The caller's **best** request status for this date, if any — a user can hold both a PRIMARY
        and a COMMON_POOL row for one day (the common-pool run enrolls the primary waitlist), and
        "you got a slot" is the answer that matters. Priority order: ALLOCATED, WAITLISTED, SUBMITTED,
        DRAFT, RELEASED, EXPIRED, CANCELLED, REJECTED.
      enum: [DRAFT, SUBMITTED, CANCELLED, ALLOCATED, WAITLISTED, REJECTED, RELEASED, EXPIRED]

    DayAvailability:
      type: object
      required:
        [date, phase, quota, blocked, requestCount, allocatedCount, available, mine, myStatus,
         mySlotNumber, requestable, boxes]
      properties:
        date: { type: string, format: date }
        phase: { $ref: '#/components/schemas/DayAvailabilityPhase' }
        quota:
          type: integer
          description: The company's effective quota for this date — also the number of boxes (D14).
        blocked: { type: integer }
        requestCount:
          type: integer
          description: >
            Live PRIMARY requests for this date — demand, not reservation. "Live" is every non-terminal
            status (DRAFT, SUBMITTED, WAITLISTED, ALLOCATED), so once `phase = DECIDED` this still counts
            the decided rows and remains >= `allocatedCount`. Informational only; never gates a
            submission (D18).
        allocatedCount:
          type: integer
          description: Rows actually allocated for this date. 0 while `phase = OPEN`.
        available: { type: integer }
        mine: { type: boolean, description: True when the caller already holds a request for this date. }
        myStatus:
          allOf: [ { $ref: '#/components/schemas/DayAvailabilityMyStatus' } ]
          nullable: true
        mySlotNumber:
          type: string
          nullable: true
          description: Set when `myStatus = ALLOCATED` (including common-pool allocations, §5.3).
        requestable: { type: boolean }
        reason:
          allOf: [ { $ref: '#/components/schemas/UnavailableReason' } ]
          nullable: true
        message: { type: string, nullable: true, description: Human-readable explanation of `reason`. }
        boxes:
          type: array
          items: { $ref: '#/components/schemas/SlotBox' }

    AvailabilityResponse:
      type: object
      required: [window, days]
      properties:
        window: { $ref: '#/components/schemas/BookingWindow' }
        days:
          type: array
          items: { $ref: '#/components/schemas/DayAvailability' }

    AllocationBand:
      type: object
      description: The half-open date range one weekly run owns — `[from, toExclusive)`.
      required: [from, toExclusive, dates]
      properties:
        from: { type: string, format: date }
        toExclusive: { type: string, format: date }
        dates:
          type: array
          items: { type: string, format: date }

    WeeklyRunDateResult:
      type: object
      required: [bookingDate, runId, status, alreadyDecided, allocated, waitlisted]
      properties:
        bookingDate: { type: string, format: date }
        runId: { type: string, description: Empty when the date failed before a run row was resolved. }
        status: { $ref: '#/components/schemas/AllocationRunStatus' }
        alreadyDecided:
          type: boolean
          description: True when an earlier run had already completed this date and it was left untouched.
        allocated: { type: integer }
        waitlisted: { type: integer }
        error: { type: string, nullable: true }

    WeeklyRunResult:
      type: object
      required: [runAt, band, dates, totalAllocated, totalWaitlisted]
      properties:
        runAt: { type: string, format: date-time }
        band: { $ref: '#/components/schemas/AllocationBand' }
        dates:
          type: array
          items: { $ref: '#/components/schemas/WeeklyRunDateResult' }
        totalAllocated: { type: integer }
        totalWaitlisted: { type: integer }

    WeeklyRunBandDate:
      type: object
      required: [bookingDate, pendingRequests, waitlistedRequests, allocated, poolAllocated]
      properties:
        bookingDate: { type: string, format: date }
        runStatus:
          allOf: [ { $ref: '#/components/schemas/AllocationRunStatus' } ]
          nullable: true
        pendingRequests: { type: integer }
        commonPoolStatus:
          allOf: [ { $ref: '#/components/schemas/AllocationRunStatus' } ]
          nullable: true
          description: >
            Status of this date's COMMON_POOL run, or null if it has not run. Independent of
            `runStatus` — the two runs are separate steps.
        waitlistedRequests:
          type: integer
          description: >
            PRIMARY requests left WAITLISTED for this date — the population the common-pool run
            would enroll. 0 means running the pool for this date would achieve nothing.
        allocated: { type: integer, description: Slots held for this date from the primary run. }
        poolAllocated: { type: integer, description: Slots held for this date from the common pool. }

    WeeklyRunPreview:
      type: object
      required: [window, band, dates, lastRun]
      properties:
        window: { $ref: '#/components/schemas/BookingWindow' }
        band: { $ref: '#/components/schemas/AllocationBand' }
        dates:
          type: array
          items: { $ref: '#/components/schemas/WeeklyRunBandDate' }
        lastRun:
          type: object
          description: >
            The band the most recent scheduled run already decided, read from the database — so an
            automatic run is visible here, not only to whoever pressed the button. Contiguous with
            `band` by construction (`lastRun.band.toExclusive == band.from`). Every `runStatus` is null
            when no run has happened yet.
          required: [runAt, commonPoolRunAt, band, dates]
          properties:
            runAt: { type: string, format: date-time, description: The scheduled primary instant this band belongs to. }
            commonPoolRunAt: { type: string, format: date-time, description: The common-pool instant for the same run. }
            band: { $ref: '#/components/schemas/AllocationBand' }
            dates:
              type: array
              items: { $ref: '#/components/schemas/WeeklyRunBandDate' }

    # --- Gate: vehicle registry + check-in/out (Phase 7 §5) ---
    VehicleSummary:
      type: object
      required: [id, vehicleNumber, displayNumber, ownerName, vehicleType]
      properties:
        id: { type: string }
        vehicleNumber: { type: string, description: Normalized plate (uppercase, no separators). }
        displayNumber: { type: string, description: Plate as written in the source sheet. }
        ownerName: { type: string }
        ownerEmail: { type: string, nullable: true }
        contactNumber: { type: string, nullable: true }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        makeModel: { type: string, nullable: true }
        colour: { type: string, nullable: true }
        companyId: { type: string, nullable: true }
        companyName: { type: string, nullable: true }

    GateLookup:
      type: object
      required: [vehicleNumber, known, bookingDate, hasBooking]
      properties:
        vehicleNumber: { type: string }
        known: { type: boolean, description: False for a plate not in the registry — still checkable-in (D16). }
        vehicle:
          allOf: [ { $ref: '#/components/schemas/VehicleSummary' } ]
          nullable: true
        bookingDate: { type: string, format: date, description: Today's IST business date. }
        hasBooking: { type: boolean }
        booking:
          type: object
          nullable: true
          required: [id, status, bookingType]
          properties:
            id: { type: string }
            status: { $ref: '#/components/schemas/BookingStatus' }
            bookingType: { $ref: '#/components/schemas/BookingType' }
            allocatedSlotNumber: { type: string, nullable: true }
        openVisit:
          type: object
          nullable: true
          description: Set when the car is already inside and has not checked out.
          required: [id, checkInAt]
          properties:
            id: { type: string }
            checkInAt: { type: string, format: date-time }

    GateEventStatus:
      type: string
      enum: [CHECKED_IN, CHECKED_OUT]

    GateEvent:
      type: object
      required: [id, vehicleNumber, displayNumber, bookingDate, hadBooking, status, checkInAt]
      properties:
        id: { type: string }
        vehicleNumber: { type: string }
        displayNumber: { type: string }
        ownerName: { type: string, nullable: true }
        companyId: { type: string, nullable: true }
        companyName: { type: string, nullable: true }
        bookingDate: { type: string, format: date }
        bookingRequestId: { type: string, nullable: true }
        hadBooking:
          type: boolean
          description: False → surfaced on the company-admin dashboard as an entry without a booking (D16).
        status: { $ref: '#/components/schemas/GateEventStatus' }
        checkInAt: { type: string, format: date-time }
        checkOutAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }

    GateCheckInRequest:
      type: object
      required: [vehicleNumber]
      properties:
        vehicleNumber: { type: string, description: Any spacing/case — normalized server-side. }
        notes: { type: string, nullable: true }

    GateCheckOutRequest:
      type: object
      required: [vehicleNumber]
      properties:
        vehicleNumber: { type: string }
        notes: { type: string, nullable: true }

    # --- Reports (P3-09 — Later) ---
    ReportType:
      type: string
      enum:
        - daily-allocation
        - company-utilization
        - user-booking-history
        - requests-vs-allocations
        - common-pool-utilization
        - blocked-slot-history
        - released-slot-history
        - frequent-winners
        - frequent-waitlisted
        - carpool-participation
        - allocation-score-breakdown

    # --- Allocation enums (from prisma/schema.prisma) ---
    AllocationRunType:
      type: string
      enum: [PRIMARY, COMMON_POOL]
    AllocationRunStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
    AllocationOutcome:
      type: string
      description: Per-request result of an allocation run (maps to BookingStatus ALLOCATED/WAITLISTED).
      enum: [ALLOCATED, WAITLISTED]

    # --- Bookings (P3-06) ---
    CarpoolMemberInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        employeeEmail:
          type: string
          format: email
          nullable: true
          description: Same-company employee email; only validated same-company employees are scored (F4).
        contactNumber: { type: string, nullable: true }
        pickupLocation: { type: string, nullable: true }

    CarpoolMember:
      type: object
      required: [name, sameCompany, isScored]
      properties:
        id: { type: string }
        name: { type: string }
        employeeEmail: { type: string, format: email, nullable: true }
        sameCompany: { type: boolean }
        isScored: { type: boolean, description: True only for validated same-company employees (F4). }

    CreateBookingRequest:
      type: object
      required: [bookingDate, carpoolPeople]
      properties:
        bookingDate: { type: string, format: date, description: "Target bookable weekday (Mon–Fri, D7)." }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        vehicleNumber: { type: string, nullable: true }
        carpoolPeople:
          type: integer
          minimum: 1
          description: >
            Total people incl. the driver (person 1, D3). Server enforces the current carpool.maxPeople cap
            (default 4, D8) — no fixed maximum is baked into the contract so a config change needs no re-spec.
        specialRequirement: { type: string, nullable: true }
        carpoolMembers:
          type: array
          description: Optional carpool members; only same-company employees are scored (F4).
          items: { $ref: '#/components/schemas/CarpoolMemberInput' }

    CreateBookingsBatchRequest:
      type: object
      description: >
        Multi-date booking. Identical to CreateBookingRequest except that `bookingDate` becomes
        `bookingDates`; every other field is applied unchanged to each date.
      required: [bookingDates, carpoolPeople]
      properties:
        bookingDates:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: >
            Target bookable weekdays (Mon–Fri, D7). Duplicates are collapsed and the list is sorted
            ascending before booking. The cap of 20 is the most weekdays a maximum 4-week window can
            contain, so it can never reject a legitimate selection.
          items: { type: string, format: date }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        vehicleNumber: { type: string, nullable: true }
        carpoolPeople:
          type: integer
          minimum: 1
          description: >
            Total people incl. the driver (person 1, D3), applied to every date. Server enforces the
            current carpool.maxPeople cap (default 4, D8).
        specialRequirement: { type: string, nullable: true }
        carpoolMembers:
          type: array
          description: Optional carpool members, applied to every date; only same-company employees are scored (F4).
          items: { $ref: '#/components/schemas/CarpoolMemberInput' }

    BookingBatchResult:
      type: object
      description: Outcome for a single date within a batch.
      required: [bookingDate, outcome]
      properties:
        bookingDate: { type: string, format: date }
        outcome: { type: string, enum: [CREATED, FAILED] }
        booking:
          allOf: [{ $ref: '#/components/schemas/BookingCreatedData' }]
          nullable: true
          description: Present when `outcome` is CREATED.
        code:
          type: string
          nullable: true
          description: >
            Present when `outcome` is FAILED — the same error code the single-date endpoint would have
            returned for this date (CONFLICT, WINDOW_CLOSED, VALIDATION_ERROR).
        message:
          type: string
          nullable: true
          description: Present when `outcome` is FAILED — human-readable reason, safe to show the user.

    BookingsBatchData:
      type: object
      required: [requested, createdCount, failedCount, results]
      properties:
        requested: { type: integer, description: Distinct dates evaluated after de-duplication. }
        createdCount: { type: integer }
        failedCount: { type: integer }
        results:
          type: array
          description: One entry per requested date, ascending.
          items: { $ref: '#/components/schemas/BookingBatchResult' }

    UpdateBookingRequest:
      type: object
      description: Partial edit before the primary cutoff. All fields optional.
      properties:
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        vehicleNumber: { type: string, nullable: true }
        carpoolPeople: { type: integer, minimum: 1 }
        specialRequirement: { type: string, nullable: true }
        carpoolMembers:
          type: array
          items: { $ref: '#/components/schemas/CarpoolMemberInput' }

    CancelBookingRequest:
      type: object
      properties:
        reason: { type: string, nullable: true }

    ReleaseBookingRequest:
      type: object
      properties:
        reason: { type: string, nullable: true }

    BookingCreatedData:
      type: object
      required: [id, status, bookingType, bookingDate, carpoolPeople]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        bookingType: { $ref: '#/components/schemas/BookingType' }
        bookingDate: { type: string, format: date }
        travelDistanceKm:
          type: number
          nullable: true
          description: Snapshotted from the user's profile at submission (F6).
        carpoolPeople: { type: integer }
        submittedAt: { type: string, format: date-time, nullable: true }

    ScoreBreakdown:
      type: object
      description: Per-factor allocation scoring (decisions §3). Present once an allocation run has scored the booking.
      required: [people, distanceScore, carpoolScore, distanceWeight, carpoolWeight, finalScore]
      properties:
        distanceKm: { type: number, nullable: true, description: Snapshotted travel distance used for scoring. }
        people: { type: integer, description: "1 (driver) + scored same-company carpool members (F4)." }
        distanceScore: { type: number, description: "(min(distanceKm, maxDistanceKm)/maxDistanceKm)*100." }
        carpoolScore: { type: number, description: "((min(people, maxPeople)-1)/(maxPeople-1))*100." }
        distanceWeight: { type: number }
        carpoolWeight: { type: number }
        finalScore: { type: number, description: "distanceWeight*distanceScore + carpoolWeight*carpoolScore." }

    BookingDetail:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          properties:
            carpoolMembers:
              type: array
              items: { $ref: '#/components/schemas/CarpoolMember' }
            scoreBreakdown:
              allOf: [ { $ref: '#/components/schemas/ScoreBreakdown' } ]
              description: Per-factor scores; present only after an allocation run has scored this booking (absent/null before).

    # --- Allocation (P3-07) ---
    PrimaryRunRequest:
      type: object
      required: [bookingDate]
      properties:
        bookingDate: { type: string, format: date }

    AllocationOverrideRequest:
      type: object
      required: [bookingId, slotId]
      properties:
        bookingId: { type: string }
        slotId: { type: string }
        reason: { type: string, nullable: true }

    AllocationResultRow:
      type: object
      required: [rank, outcome, people, distanceScore, carpoolScore, finalScore]
      properties:
        rank: { type: integer, minimum: 1 }
        bookingId: { type: string }
        userId: { type: string }
        user: { type: string, description: User full name (display). }
        companyName: { type: string, nullable: true, description: Company name (display). }
        distanceKm: { type: number, nullable: true }
        people: { type: integer }
        distanceScore: { type: number }
        carpoolScore: { type: number }
        finalScore: { type: number }
        outcome: { $ref: '#/components/schemas/AllocationOutcome' }
        slotNumber: { type: string, nullable: true, description: "Assigned slot number if ALLOCATED; null otherwise." }

    AllocationRunSummary:
      type: object
      required: [id, runType, bookingDate, status]
      properties:
        id: { type: string }
        runType: { $ref: '#/components/schemas/AllocationRunType' }
        bookingDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/AllocationRunStatus' }
        idempotencyKey: { type: string }
        attemptCount: { type: integer }
        totalRequests: { type: integer, description: SUBMITTED requests considered for the run. }
        allocatedCount: { type: integer }
        waitlistedCount: { type: integer }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }

    AllocationBreakdown:
      type: object
      required: [runId, bookingDate, status, results]
      properties:
        runId: { type: string }
        bookingDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/AllocationRunStatus' }
        weights:
          type: object
          description: Weights applied for this run (decisions §3).
          properties:
            distanceWeight: { type: number }
            carpoolWeight: { type: number }
        results:
          type: array
          items: { $ref: '#/components/schemas/AllocationResultRow' }

  responses:
    MessageOk:
      description: Success with a simple acknowledgement message.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
          example: { success: true, data: { message: OK } }
    ValidationError:
      description: 400 — request validation failed.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details: [ { field: distanceKm, message: must be between 0 and 200 } ]
    Unauthorized:
      description: 401 — missing/invalid/expired access token or bad credentials.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: UNAUTHENTICATED, message: Invalid credentials } }
    Forbidden:
      description: 403 — role or tenant-scope violation (or inactive account).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: FORBIDDEN, message: Account is not active } }
    NotFound:
      description: 404 — resource absent or not visible to the tenant.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: NOT_FOUND, message: Resource not found } }
    Conflict:
      description: 409 — duplicate resource.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: CONFLICT, message: Email already registered } }
    RateLimited:
      description: 429 — too many requests.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: RATE_LIMITED, message: Too many requests } }
    WindowClosed:
      description: 422 — action attempted outside its allowed time window (e.g. after `booking.primaryCutoff`, or a non-bookable date).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: WINDOW_CLOSED, message: The booking window is closed for this date } }
