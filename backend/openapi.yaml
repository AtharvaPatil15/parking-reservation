        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Slots & Quota]
      operationId: setCompanyQuota
      summary: Set a company's slot quota (effective-dated)
      x-maturity: DEMO
      x-required-roles: [SUPER_ADMIN]
      requestBody:
        required: true
        content:
