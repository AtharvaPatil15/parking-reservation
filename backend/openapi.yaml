openapi: 3.0.3
info:
  title: Parking POC API
  version: 0.1.0
  description: >
    Office parking-slot booking platform. Contract-first source of truth (frozen at M0 — changes via
    reviewed PR). Conventions, envelope, and error codes per docs/phases-3-6-plan.md §3.1–3.2.
    Maturity of each operation is marked with `x-maturity` (DEMO | MVP | Later).

servers:
  - url: /api/v1
    description: Base path (path-based versioning)

# Default: every operation requires a bearer access token. Public endpoints override with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication & session lifecycle
  - name: User
    description: Current-user (self) profile, bookings, notifications
  - name: Bookings
    description: Parking booking requests — create, status, edit, cancel, release (P3-06)
  - name: Allocation
    description: Primary/common-pool allocation runs and score breakdowns (P3-07)

paths:
  # ---------------------------------------------------------------------------
  # Auth  (P3-02)
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in (issue access + refresh)
      description: >
        Validates credentials and returns a short-lived access JWT. A refresh token is set as an
        HttpOnly, Secure, SameSite cookie (rotation is [MVP]). Errors: 401 on bad credentials,
        403 if the user's status is not ACTIVE.
      x-maturity: DEMO
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: aditi@assent.example, password: "ChangeMe#12345" }
      responses:
        '200':
          description: Authenticated. Refresh token set via Set-Cookie.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Set-Cookie:
              description: HttpOnly refresh-token cookie (e.g. `refreshToken=…; HttpOnly; Secure; SameSite=Strict`)
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponseData' }
              example:
                success: true
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tokenType: Bearer
                  expiresIn: 900
                  user: { id: "usr_123", fullName: "Aditi Rao", role: USER, companyId: "cmp_1", companyName: Assent }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a new company user (status PENDING)
      description: >
        Creates a user under an active company with status PENDING (awaits Company-Admin approval).
        Validations — unique email, valid contact number, valid PIN, distanceKm 0–200, password strength,
        company must be active, one company per user.
      x-maturity: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registration accepted; verification email dispatched.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm an email-verification token
      x-maturity: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Rotate refresh token, issue a new access token
      description: Uses the HttpOnly refresh cookie; rotates it and returns a fresh access token.
      x-maturity: MVP
      security: []
      responses:
        '200':
          description: New access token issued; refresh cookie rotated.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Set-Cookie:
              description: Rotated HttpOnly refresh-token cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AccessTokenData' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh token
      x-maturity: MVP
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password-reset email
      x-maturity: Later
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset password using a reset token
      x-maturity: Later
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change password (authenticated)
      x-maturity: Later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------------------
  # User (self)  (P3-03)
  # ---------------------------------------------------------------------------
  /me:
    get:
      tags: [User]
      operationId: getMe
      summary: Get the current user's profile
      x-maturity: DEMO
      responses:
        '200':
          description: Current profile
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [User]
      operationId: updateMe
      summary: Update the current user's profile (incl. distanceKm)
      description: Partial update. `distanceKm` is the manually-entered home→office distance (0–200 km).
      x-maturity: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated profile
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/bookings:
    get:
      tags: [User]
      operationId: getMyBookings
      summary: List the current user's bookings (paged)
      x-maturity: DEMO
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: status
          in: query
          required: false
          description: Optional filter by booking status
          schema: { $ref: '#/components/schemas/BookingStatus' }
      responses:
        '200':
          description: Paged list of the user's bookings
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Booking' }
                      meta: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notifications:
    get:
      tags: [User]
      operationId: getMyNotifications
      summary: List the current user's in-app notifications (paged)
      x-maturity: MVP
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paged list of notifications
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
                      meta: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    patch:
      tags: [User]
      operationId: markNotificationRead
      summary: Mark a notification as read
      x-maturity: MVP
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Notification marked read
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Bookings  (P3-06)  — Role: USER (own). Tenant-scoped by companyId.
  # ---------------------------------------------------------------------------
  /bookings:
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Submit a parking request for the next bookable weekday
      description: >
        Role: USER. Creates a PRIMARY booking for a bookable weekday (Mon–Fri, D7). `travelDistanceKm` is
        snapshotted from the user's profile at submission (F6); `carpoolPeople` includes the driver as person 1
        (D3) and the server enforces the current `carpool.maxPeople` cap (default 4, D8). Only same-company
        employee carpool members are scored (F4). Errors: 422 WINDOW_CLOSED if past `booking.primaryCutoff` or
        a non-bookable date; 409 CONFLICT on a duplicate same-type request for the date.
      x-maturity: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
            example:
              bookingDate: "2026-07-31"
              vehicleType: CAR
              vehicleNumber: MH12AB1234
              carpoolPeople: 3
              specialRequirement: null
              carpoolMembers:
                - { name: Rahul Mehta, employeeEmail: rahul@assent.example }
                - { name: Neighbour, employeeEmail: null }
      responses:
        '201':
          description: Booking submitted.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingCreatedData' }
              example:
                success: true
                data:
                  id: bkg_123
                  status: SUBMITTED
                  bookingType: PRIMARY
                  bookingDate: "2026-07-31"
                  travelDistanceKm: 12.4
                  carpoolPeople: 3
                  submittedAt: "2026-07-30T11:20:00Z"
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/WindowClosed' }

  /bookings/common-pool:
    post:
      tags: [Bookings]
      operationId: createCommonPoolBooking
      summary: Submit a common-pool request (after primary results)
      description: >
        Role: USER. Same body as POST /bookings but recorded as a COMMON_POOL request. Valid only while the
        common-pool window is open (`booking.primaryResultsBy` → `booking.commonPoolClose`, D8).
      x-maturity: Later
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201':
          description: Common-pool request submitted.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingCreatedData' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/WindowClosed' }

  /bookings/{id}:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Get a booking's status, allocated slot, and score breakdown
      description: "Role: USER (own) / COMPANY_ADMIN (own company) / SUPER_ADMIN. Returns 404 if not visible to the tenant."
      x-maturity: DEMO
      responses:
        '200':
          description: Booking detail incl. allocated slot and per-factor score breakdown (once allocation has run).
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Bookings]
      operationId: updateBooking
      summary: Edit a booking before the primary cutoff
      description: "Role: USER (own). Partial edit; allowed only while `now < booking.primaryCutoff` (else 422 WINDOW_CLOSED)."
      x-maturity: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBookingRequest' }
      responses:
        '200':
          description: Booking updated.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/WindowClosed' }

  /bookings/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    post:
      tags: [Bookings]
      operationId: cancelBooking
      summary: Cancel a booking before the primary cutoff
      description: "Role: USER (own). Allowed only while `now < booking.primaryCutoff` (else 422 WINDOW_CLOSED)."
      x-maturity: MVP
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelBookingRequest' }
      responses:
        '200':
          description: Booking cancelled.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/WindowClosed' }

  /bookings/{id}/release:
    parameters:
      - $ref: '#/components/parameters/BookingIdParam'
    post:
      tags: [Bookings]
      operationId: releaseBooking
      summary: Release an allocated slot
      description: >
        Role: USER (own) or COMPANY_ADMIN (own users). Releasing an allocated slot after primary allocation
        triggers reallocation to the highest-scoring own-company waitlisted user first, else the slot moves to
        the common pool (F3). Audited + notified.
      x-maturity: MVP
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseBookingRequest' }
      responses:
        '200':
          description: Slot released (reallocation handled server-side, F3).
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------------------
  # Allocation  (P3-07)  — Role: SUPER_ADMIN.
  # ---------------------------------------------------------------------------
  /allocation/primary/run:
    post:
      tags: [Allocation]
      operationId: runPrimaryAllocation
      summary: Run (or re-run) primary allocation for a date
      description: >
        Role: SUPER_ADMIN. Idempotent per (runType=PRIMARY, bookingDate) — a COMPLETED run returns the cached
        result. Ranks SUBMITTED PRIMARY bookings by FinalScore (decisions §3) within each company's available
        quota, assigns concrete slots transactionally, and waitlists the rest.
      x-maturity: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrimaryRunRequest' }
            example: { bookingDate: "2026-07-31" }
      responses:
        '200':
          description: Allocation run accepted or already complete (idempotent). Returns the run summary.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AllocationRunSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /allocation/common-pool/run:
    post:
      tags: [Allocation]
      operationId: runCommonPoolAllocation
      summary: Run common-pool allocation for a date
      description: "Role: SUPER_ADMIN. Idempotent per (runType=COMMON_POOL, bookingDate)."
      x-maturity: Later
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrimaryRunRequest' }
      responses:
        '200':
          description: Common-pool allocation run summary.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AllocationRunSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /allocation/override:
    post:
      tags: [Allocation]
      operationId: overrideAllocation
      summary: Manually override a single allocation
      description: "Role: SUPER_ADMIN. Assigns a specific slot to a booking, bypassing the scored ranking. Audited."
      x-maturity: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationOverrideRequest' }
      responses:
        '200':
          description: Override applied; returns the affected booking.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /allocation/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/RunIdParam'
    get:
      tags: [Allocation]
      operationId: getAllocationRun
      summary: Get an allocation run's status and summary counts
      description: "Role: SUPER_ADMIN."
      x-maturity: DEMO
      responses:
        '200':
          description: Run status + allocated/waitlisted summary.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AllocationRunSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /allocation/runs/{id}/breakdown:
    parameters:
      - $ref: '#/components/parameters/RunIdParam'
    get:
      tags: [Allocation]
      operationId: getAllocationBreakdown
      summary: Per-user ranked score breakdown for a run
      description: "Role: SUPER_ADMIN. Explains every outcome with per-factor scores + rank (decisions §3)."
      x-maturity: DEMO
      responses:
        '200':
          description: Ranked results with distance/carpool/final scores and outcome.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AllocationBreakdown' }
              example:
                success: true
                data:
                  runId: run_123
                  bookingDate: "2026-07-31"
                  status: COMPLETED
                  weights: { distanceWeight: 0.60, carpoolWeight: 0.40 }
                  results:
                    - { rank: 1, bookingId: bkg_9, userId: usr_3, user: Sara Khan, distanceKm: 38.1, people: 3, distanceScore: 95.25, carpoolScore: 66.67, finalScore: 84.1, outcome: ALLOCATED, slotNumber: B1-01 }
                    - { rank: 2, bookingId: bkg_5, userId: usr_1, user: Aditi Rao, distanceKm: 12.4, people: 3, distanceScore: 31.0, carpoolScore: 66.67, finalScore: 45.27, outcome: WAITLISTED, slotNumber: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

# =============================================================================
# Reusable components  (P3-01)
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token from `POST /auth/login`, sent as `Authorization: Bearer <token>`."

  headers:
    CorrelationId:
      description: Request/response correlation id (echoed into AuditLog).
      schema: { type: string }

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: Items per page (max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SortParam:
      name: sort
      in: query
      required: false
      description: Field to sort by.
      schema: { type: string }
    OrderParam:
      name: order
      in: query
      required: false
      description: Sort direction.
      schema: { type: string, enum: [asc, desc], default: desc }
    BookingIdParam:
      name: id
      in: path
      required: true
      description: Booking request id.
      schema: { type: string }
    RunIdParam:
      name: id
      in: path
      required: true
      description: Allocation run id.
      schema: { type: string }

  schemas:
    # --- Envelope & pagination (reusable) ---
    SuccessEnvelope:
      type: object
      description: Standard success envelope. `data` is the resource/list; `meta` present only on list endpoints.
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object }
        meta: { $ref: '#/components/schemas/Pagination' }

    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error: { $ref: '#/components/schemas/ErrorObject' }

    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    ErrorCode:
      type: string
      description: Canonical error codes (docs/phases-3-6-plan.md §3.2).
      enum:
        - VALIDATION_ERROR   # 400
        - UNAUTHENTICATED    # 401
        - FORBIDDEN          # 403
        - NOT_FOUND          # 404
        - CONFLICT           # 409
        - WINDOW_CLOSED      # 422
        - RATE_LIMITED       # 429
        - INTERNAL           # 500

    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    # --- Enums (from prisma/schema.prisma) ---
    RoleName:
      type: string
      enum: [SUPER_ADMIN, COMPANY_ADMIN, USER]
    UserStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED, INACTIVE]
    BookingType:
      type: string
      enum: [PRIMARY, COMMON_POOL]
    BookingStatus:
      type: string
      enum: [DRAFT, SUBMITTED, CANCELLED, ALLOCATED, WAITLISTED, REJECTED, RELEASED, EXPIRED]
    VehicleType:
      type: string
      enum: [CAR, BIKE, EV_CAR, EV_BIKE, OTHER]
    NotificationChannel:
      type: string
      enum: [EMAIL, IN_APP, SMS, PUSH]
    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED, READ]

    # --- Auth ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 1 }

    AuthUser:
      type: object
      required: [id, fullName, role, companyId, companyName]
      properties:
        id: { type: string }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/RoleName' }
        companyId: { type: string }
        companyName: { type: string }

    AccessTokenData:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Access-token lifetime in seconds. }

    LoginResponseData:
      allOf:
        - $ref: '#/components/schemas/AccessTokenData'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/AuthUser' }

    RegisterRequest:
      type: object
      required: [fullName, companyId, email, contactNumber, address, pinCode, password, confirmPassword]
      properties:
        fullName: { type: string }
        companyId: { type: string, description: Must reference an ACTIVE company. }
        email: { type: string, format: email }
        contactNumber: { type: string }
        address: { type: string }
        pinCode: { type: string }
        distanceKm:
          type: number
          nullable: true
          minimum: 0
          maximum: 200
          description: Manually-entered home→office distance in km (D6). Optional at registration.
        password: { type: string, format: password }
        confirmPassword: { type: string, format: password }

    # --- User (self) ---
    UserProfile:
      type: object
      required: [id, fullName, email, contactNumber, address, pinCode, status, emailVerified, companyId, companyName, role]
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        contactNumber: { type: string }
        address: { type: string }
        pinCode: { type: string }
        distanceKm: { type: number, nullable: true, minimum: 0, maximum: 200 }
        status: { $ref: '#/components/schemas/UserStatus' }
        emailVerified: { type: boolean }
        companyId: { type: string }
        companyName: { type: string }
        role: { $ref: '#/components/schemas/RoleName' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpdateProfileRequest:
      type: object
      description: Partial update; all fields optional.
      properties:
        fullName: { type: string }
        contactNumber: { type: string }
        address: { type: string }
        pinCode: { type: string }
        distanceKm: { type: number, nullable: true, minimum: 0, maximum: 200 }

    Booking:
      type: object
      required: [id, bookingDate, bookingType, status, carpoolMemberCount, createdAt]
      properties:
        id: { type: string }
        bookingDate: { type: string, format: date }
        bookingType: { $ref: '#/components/schemas/BookingType' }
        status: { $ref: '#/components/schemas/BookingStatus' }
        travelDistanceKm: { type: number, nullable: true }
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        vehicleNumber: { type: string, nullable: true }
        carpoolMemberCount: { type: integer, minimum: 0 }
        specialRequirement: { type: string, nullable: true }
        allocationScore: { type: number, nullable: true }
        allocatedSlotNumber:
          type: string
          nullable: true
          description: Slot number if ALLOCATED, else null.
        submittedAt: { type: string, nullable: true, format: date-time }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, channel, status, subject, body, createdAt]
      properties:
        id: { type: string }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        status: { $ref: '#/components/schemas/NotificationStatus' }
        subject: { type: string }
        body: { type: string }
        metadata: { type: object, nullable: true, additionalProperties: true }
        sentAt: { type: string, nullable: true, format: date-time }
        readAt: { type: string, nullable: true, format: date-time }
        createdAt: { type: string, format: date-time }

    # --- Allocation enums (from prisma/schema.prisma) ---
    AllocationRunType:
      type: string
      enum: [PRIMARY, COMMON_POOL]
    AllocationRunStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
    AllocationOutcome:
      type: string
      description: Per-request result of an allocation run (maps to BookingStatus ALLOCATED/WAITLISTED).
      enum: [ALLOCATED, WAITLISTED]

    # --- Bookings (P3-06) ---
    CarpoolMemberInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        employeeEmail:
          type: string
          format: email
          nullable: true
          description: Same-company employee email; only validated same-company employees are scored (F4).
        contactNumber: { type: string, nullable: true }
        pickupLocation: { type: string, nullable: true }

    CarpoolMember:
      type: object
      required: [name, sameCompany, isScored]
      properties:
        id: { type: string }
        name: { type: string }
        employeeEmail: { type: string, format: email, nullable: true }
        sameCompany: { type: boolean }
        isScored: { type: boolean, description: True only for validated same-company employees (F4). }

    CreateBookingRequest:
      type: object
      required: [bookingDate, carpoolPeople]
      properties:
        bookingDate: { type: string, format: date, description: "Target bookable weekday (Mon–Fri, D7)." }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        vehicleNumber: { type: string, nullable: true }
        carpoolPeople:
          type: integer
          minimum: 1
          description: >
            Total people incl. the driver (person 1, D3). Server enforces the current carpool.maxPeople cap
            (default 4, D8) — no fixed maximum is baked into the contract so a config change needs no re-spec.
        specialRequirement: { type: string, nullable: true }
        carpoolMembers:
          type: array
          description: Optional carpool members; only same-company employees are scored (F4).
          items: { $ref: '#/components/schemas/CarpoolMemberInput' }

    UpdateBookingRequest:
      type: object
      description: Partial edit before the primary cutoff. All fields optional.
      properties:
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        vehicleNumber: { type: string, nullable: true }
        carpoolPeople: { type: integer, minimum: 1 }
        specialRequirement: { type: string, nullable: true }
        carpoolMembers:
          type: array
          items: { $ref: '#/components/schemas/CarpoolMemberInput' }

    CancelBookingRequest:
      type: object
      properties:
        reason: { type: string, nullable: true }

    ReleaseBookingRequest:
      type: object
      properties:
        reason: { type: string, nullable: true }

    BookingCreatedData:
      type: object
      required: [id, status, bookingType, bookingDate, carpoolPeople]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        bookingType: { $ref: '#/components/schemas/BookingType' }
        bookingDate: { type: string, format: date }
        travelDistanceKm:
          type: number
          nullable: true
          description: Snapshotted from the user's profile at submission (F6).
        carpoolPeople: { type: integer }
        submittedAt: { type: string, format: date-time, nullable: true }

    ScoreBreakdown:
      type: object
      description: Per-factor allocation scoring (decisions §3). Present once an allocation run has scored the booking.
      required: [people, distanceScore, carpoolScore, distanceWeight, carpoolWeight, finalScore]
      properties:
        distanceKm: { type: number, nullable: true, description: Snapshotted travel distance used for scoring. }
        people: { type: integer, description: "1 (driver) + scored same-company carpool members (F4)." }
        distanceScore: { type: number, description: "(min(distanceKm, maxDistanceKm)/maxDistanceKm)*100." }
        carpoolScore: { type: number, description: "((min(people, maxPeople)-1)/(maxPeople-1))*100." }
        distanceWeight: { type: number }
        carpoolWeight: { type: number }
        finalScore: { type: number, description: "distanceWeight*distanceScore + carpoolWeight*carpoolScore." }

    BookingDetail:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          properties:
            carpoolMembers:
              type: array
              items: { $ref: '#/components/schemas/CarpoolMember' }
            scoreBreakdown:
              allOf: [ { $ref: '#/components/schemas/ScoreBreakdown' } ]
              description: Per-factor scores; present only after an allocation run has scored this booking (absent/null before).

    # --- Allocation (P3-07) ---
    PrimaryRunRequest:
      type: object
      required: [bookingDate]
      properties:
        bookingDate: { type: string, format: date }

    AllocationOverrideRequest:
      type: object
      required: [bookingId, slotId]
      properties:
        bookingId: { type: string }
        slotId: { type: string }
        reason: { type: string, nullable: true }

    AllocationResultRow:
      type: object
      required: [rank, outcome, people, distanceScore, carpoolScore, finalScore]
      properties:
        rank: { type: integer, minimum: 1 }
        bookingId: { type: string }
        userId: { type: string }
        user: { type: string, description: User full name (display). }
        distanceKm: { type: number, nullable: true }
        people: { type: integer }
        distanceScore: { type: number }
        carpoolScore: { type: number }
        finalScore: { type: number }
        outcome: { $ref: '#/components/schemas/AllocationOutcome' }
        slotNumber: { type: string, nullable: true, description: "Assigned slot number if ALLOCATED; null otherwise." }

    AllocationRunSummary:
      type: object
      required: [id, runType, bookingDate, status]
      properties:
        id: { type: string }
        runType: { $ref: '#/components/schemas/AllocationRunType' }
        bookingDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/AllocationRunStatus' }
        idempotencyKey: { type: string }
        attemptCount: { type: integer }
        totalRequests: { type: integer, description: SUBMITTED requests considered for the run. }
        allocatedCount: { type: integer }
        waitlistedCount: { type: integer }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }

    AllocationBreakdown:
      type: object
      required: [runId, bookingDate, status, results]
      properties:
        runId: { type: string }
        bookingDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/AllocationRunStatus' }
        weights:
          type: object
          description: Weights applied for this run (decisions §3).
          properties:
            distanceWeight: { type: number }
            carpoolWeight: { type: number }
        results:
          type: array
          items: { $ref: '#/components/schemas/AllocationResultRow' }

  responses:
    MessageOk:
      description: Success with a simple acknowledgement message.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
          example: { success: true, data: { message: OK } }
    ValidationError:
      description: 400 — request validation failed.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details: [ { field: distanceKm, message: must be between 0 and 200 } ]
    Unauthorized:
      description: 401 — missing/invalid/expired access token or bad credentials.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: UNAUTHENTICATED, message: Invalid credentials } }
    Forbidden:
      description: 403 — role or tenant-scope violation (or inactive account).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: FORBIDDEN, message: Account is not active } }
    NotFound:
      description: 404 — resource absent or not visible to the tenant.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: NOT_FOUND, message: Resource not found } }
    Conflict:
      description: 409 — duplicate resource.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: CONFLICT, message: Email already registered } }
    RateLimited:
      description: 429 — too many requests.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: RATE_LIMITED, message: Too many requests } }
    WindowClosed:
      description: 422 — action attempted outside its allowed time window (e.g. after `booking.primaryCutoff`, or a non-bookable date).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: WINDOW_CLOSED, message: The booking window is closed for this date } }
