  # ---------------------------------------------------------------------------
  # Availability + Gate  (Phase 7)
  # ---------------------------------------------------------------------------
  /availability:
    get:
      tags: [Bookings]
      operationId: getAvailability
      summary: Per-date slot grid for the caller's company + booking-window summary
      description: >
        Any authenticated role. Returns one entry per date in `[from, to]` (defaulting to exactly the
        currently-open window) with the company's quota, how much is blocked, and a `boxes` array to
        render as the slot grid. The company always comes from the principal, never the query.
        Requests never consume capacity (D18): each date has a `phase` — `OPEN` (before that date's
        weekly run) shows only AVAILABLE/BLOCKED boxes plus a `requestCount` of live requests as a
        count, not boxes; `DECIDED` (after the run) shows real allocations via `allocatedCount` and
        MINE/TAKEN boxes with `slotNumber` (D22).
      x-maturity: MVP
      x-required-roles: [USER, COMPANY_ADMIN, SUPER_ADMIN, SECURITY]
      parameters:
        - name: from
          in: query
          required: false
          description: First date (YYYY-MM-DD). Defaults to the first requestable date.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Last date (YYYY-MM-DD). Defaults to the end of the window. Max span 120 days.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Window summary plus per-date availability.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AvailabilityResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /allocation/weekly:
    get:
      tags: [Allocation]
      operationId: getWeeklyRunPreview
      summary: Preview the band the next weekly batch owns
      description: >
        Role SUPER_ADMIN. Shows the dates the upcoming weekend batch will decide, each with its
        pending-request count and current run status, so the run can be inspected before triggering.
      x-maturity: MVP
      x-required-roles: [SUPER_ADMIN]
      responses:
        '200':
          description: Band preview.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WeeklyRunPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /allocation/weekly/run:
    post:
      tags: [Allocation]
      operationId: runWeeklyAllocation
      summary: Run the weekly weekend allocation batch
      description: >
        Role SUPER_ADMIN. Decides every bookable weekday in the band the upcoming run owns —
        `[nextRunDate + approvalLeadDays, followingRunDate + approvalLeadDays)` — by delegating to the
        per-date primary run, so each date stays idempotent and score-explained. Takes no body: the
        band comes from config. Dates already COMPLETED are reported as `alreadyDecided` and left
        alone, and one failing date does not abort the others. Overflow waitlists; it never rejects.
      x-maturity: MVP
      x-required-roles: [SUPER_ADMIN]
      responses:
        '200':
          description: Per-date outcomes for the band.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WeeklyRunResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /allocation/weekly/common-pool/run:
    post:
      tags: [Allocation]
      operationId: runWeeklyCommonPoolAllocation
      summary: Run the common pool across the weekly band
      description: >
        Role SUPER_ADMIN. The band-scoped sibling of `POST /allocation/weekly/run`: for every date in
        the band the upcoming run owns, enrolls the users primary left WAITLISTED, derives pool
        inventory from every company's unused quota, and assigns it cross-company by FinalScore.
        Takes no body — the band comes from config. Idempotent per (COMMON_POOL, date): dates already
        COMPLETED are reported as `alreadyDecided`, and one failing date does not abort the others.

        Run this AFTER the primary batch; on its own there is no waitlist to enroll. The `allocated`
        and `waitlisted` counts in the response describe the COMMON_POOL requests, not the PRIMARY
        ones — a primary-waitlisted user placed by the pool stays WAITLISTED on their primary row.
      x-maturity: MVP
      x-required-roles: [SUPER_ADMIN]
      responses:
        '200':
          description: Per-date common-pool outcomes for the band.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WeeklyRunResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

